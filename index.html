const r=await rpc('leader_read',{section:target,p_limit:50,p_offset:ls.offset});if(my!==seq)return;if(!r||!Array.isArray(r.rows)||!Number.isSafeInteger(r.total)||r.rows.length>50)throw Error('رد القائمة غير صالح.');if(ls.offset){const head=await rpc('leader_read',{section:target,p_limit:20,p_offset:0});if(my!==seq)return;if(!head||!Array.isArray(head.rows)||head.total!==ls.total||JSON.stringify(head.rows)!==JSON.stringify(ls.head))throw Error('تغيّرت القائمة أثناء التصفح. حدّثها من البداية حتى لا تتكرر أو تُفقد صفوف.')}else ls.head=r.rows.slice(0,20);const seen=new Set(ls.rows.map(x=>x.id));if(r.rows.some(x=>!x.id||seen.has(x.id)))throw Error('رد القائمة يحتوي تكرارًا أو صفًا بلا مرجع. حدّثها من البداية.');ls.rows.push(...r.rows);ls.offset=ls.rows.length;ls.total=r.total;state=ls;renderList()}

function renderHome(orders,reports){const period=currentPeriod(),activeCouriers=cat.couriers.filter(c=>c.active).length;const preview=orders.rows.slice(0,3);$('main').innerHTML=`<div class="row between toolbar"><div><p class="dashdate">${esc(new Date().toLocaleDateString('ar-EG',{timeZone:'Africa/Cairo',weekday:'long',day:'numeric',month:'long'}))}</p><h1>نظرة على التشغيل</h1></div><button id="refresh" aria-label="تحديث الرئيسية">↻</button></div><section class="dashhero"><div><span class="eyebrow">ملخص الخادم</span><h2>${reports?.total?'راجع التقارير المعلقة':'متابعة التشغيل'}</h2><p>${reports?.total?esc(reports.total.toLocaleString('ar-EG'))+' تقرير بانتظار مراجعة الإثبات والمبلغ.':'طلباتك وتعاملاتك، من مكان واحد.'}</p></div><button id="homeadd" class="pri">＋ طلب جديد</button></section><div class="dashmetrics"><button class="metric" data-go="operations"><span class="metricicon">▤</span><strong>${esc(orders.total.toLocaleString('ar-EG'))}</strong><span>كل الطلبات</span><small>افتح قائمة الطلبات ‹</small></button>${reports?`<button class="metric ${reports.total?'attention':''}" data-go="reports"><span class="metricicon">✓</span><strong>${esc(reports.total.toLocaleString('ar-EG'))}</strong><span>تقرير بانتظار المراجعة</span><small>${reports.total?'راجع قبل تسجيل الأثر':'لا توجد تقارير معلقة'} ‹</small></button>`:`<div class="metric"><span class="metricicon">○</span><strong>${esc(activeCouriers.toLocaleString('ar-EG'))}</strong><span>مندوب نشط</span><small>حسب الإعدادات الحالية</small></div>`}</div><div class="dashsection"><h2>وصول سريع</h2><div class="quicklinks"><button data-go="operations">الطلبات <span>بحث وتجهيز وتوزيع ‹</span></button>${canFinance()?'<button data-go="accounts">الحسابات <span>عهدة وأجور وشركات ‹</span></button>':'<button id="homeimport">استيراد CSV <span>فحص الملف قبل الإرسال ‹</span></button>'}</div></div><section class="dashsection"><div class="row between"><h2>من قائمة الطلبات</h2><button class="textlink" data-go="operations">عرض الكل ‹</button let listQuery='',listFilter='all',accountTab='couriers';
function filteredRows(){return state.rows.filter(r=>{const hay=[r.company_order_ref,r.customer_name,r.company_name,r.courier_name,r.address].join(' ').toLowerCase();if(listQuery&&!hay.includes(listQuery.toLowerCase()))return false;if(page!=='operations')return true;if(listFilter==='action')return !r.assignment&&['received','preparing','deferred','ready'].includes(r.outcome);if(listFilter==='assigned')return !!r.assignment;return true})}
function paintRows(){const rows=filteredRows();$('rows').innerHTML=rows.length?rows.map(page==='operations'?orderCard:reportCard).join(''):'<div class="empty">'+(listQuery||listFilter!=='all'?'مفيش نتائج في الطلبات المحمّلة. حمّل الباقي أو غيّر البحث.':page==='operations'?'مفيش طلبات في القائمة.':'مفيش تقارير محتاجة مراجعة.')+'</div>';}
function renderList(){const op=page==='operations';$('main').onclick=null;$('main').innerHTML=`<div class="row between toolbar"><div><h1>${op?'الطلبات':'المراجعة'}</h1><p class="mut">${op?'الخطوة الجاية لكل طلب':'كل تقرير بيتراجع لوحده'}</p></div><button id="refresh" aria-label="تحديث البيانات">↻</button></div>${op?'<div class="mainactions"><button class="pri" id="addorder">＋ طلب جديد</button><button id="import">استيراد CSV</button></div>':'<p class="acctnote">اعتماد التقرير بيسجل العهدة والأجر. راجع الإثبات قبل القرار.</p>'}<div class="searchline"><input id="listsearch" type="search" aria-label="بحث في البيانات المحملة" placeholder="${op?'دور برقم الطلب أو اسم العميل':'دور برقم الطلب أو اسم المندوب'}" value="${esc(listQuery)}"></div>${op?`<div class="filterbar"><button data-filter="all" class="${listFilter==='all'?'on':''}">كل الطلبات</button><button data-filter="action" class="${listFilter==='action'?'on':''}">محتاج إجراء</button><button data-filter="assigned" class="${listFilter==='assigned'?'on':''}">مع المندوب</button></div>`:''}<div class="card" id="rows"></div><p class="quietcount">${state.rows.length} من ${state.total} ${op?'طلب':'تقرير معلق'} · آخر تحديث ${esc(cairo(new Date()))}</p>${state.rows.length<state.total?'<button id="more" class="full">تحميل المزيد للعرض والبحث</button>':''}`;paintRows();$('listsearch').oninput=e=>{listQuery=e.target.value;paintRows()};$('main').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{listFilter=b.dataset.filter;$('main').querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));paintRows()});$('refresh').onclick=()=>load(true);$('more')&&($('more').onclick=()=>load());if(op){$('addorder').onclick=addOrder;$('import').onclick=importCSV}$('rows').onclick=e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;const r=state.rows.find(x=>x.id===b.dataset.id);if(!r)return;if(b.dataset.action==='prepare')prepare(r);if(b.dataset.action==='assign')assign(r);if(b.dataset.action==='payment')payment(r);if(b.dataset.action==='review')review(r)}}
function act(a,id,t){return `<button data-action="${a}" data-id="${esc(id)}">${t}</button>`}
function orderCard(o){const actions=[];if(!o.assignment&&!o.payment_mode)actions.push(['payment','تأكيد الدفع']);if(!o.assignment&&['received','preparing','deferred'].includes(o.outcome))actions.push(['prepare','جهّز الطلب']);if(!o.assignment&&o.outcome==='ready'&&o.payment_mode)actions.push(['assign','اختار مندوب']);const first=actions.shift();return `<article class="item"><div class="row between"><h3>${esc(o.customer_name||o.company_order_ref)}</h3><span class="pill">${esc(status[o.outcome]||o.outcome)}</span></div><p class="mut">${esc(o.company_order_ref)} · ${esc(o.company_name)}</p><p class="mut">${esc(o.address||'العنوان غير متاح')}</p><div class="compactbottom"><span class="money"><small>البضاعة </small>${money(o.product_minor)}</span>${first?act(first[0],o.id,first[1]+' ‹'):''}</div><details class="rowdetails"><summary>تفاصيل الطلب ${actions.length?'وإجراءات تانية':''}</summary><p class="mut">العميل: ${esc(o.customer_name||'الاسم غير متاح')} · التسليم: ${esc(o.delivery_on||'بلا يوم محدد')}</p><div class="stats"><div class="stat"><small>قيمة البضاعة</small><b>${money(o.product_minor)}</b></div><div class="stat"><small>الشحن</small><b>${money(o.delivery_minor)}</b></div></div><p class="mut">الدفع: ${esc({cod:'تحصيل نقدي',prepaid_company:'مدفوع للشركة',mixed_company:'دفع مختلط'}[o.payment_mode]||'بانتظار تأكيد الشركة')}</p>${o.assignment?'<p class="mut">المندوب: '+esc(cat.couriers.find(c=>c.id===o.assignment.courier_id)?.name||'غير متاح')+'</p>':''}<div class="row">${actions.map(a=>act(a[0],o.id,a[1])).join('')}</div></details></article>`}

function parseCSV(text){const rows=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}if(q)throw Error('علامات اقتباس CSV غير مغلقة.');row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}
function importCSV(){let parsed=null;dialog('استيراد طلبات CSV',`<p>اختر ملفًا حتى 100 طلب. المبالغ بالجنيه المصري، لا بالقروش.</p><label>الشركة<select id="company">${opts(cat.companies.filter(c=>c.active))}</select></label>${field('source','مرجع دفعة الشركة')}<p class="tiny" dir="ltr">company_order_ref,customer_name,phone,address,lat,lng,product_egp,delivery_egp,package_count,delivery_on</p><button type="button" class="full" id="template">تنزيل قالب CSV فارغ</button><label>ملف CSV<input id="csv" type="file" accept=".csv,text/csv"></label><button id="preview" type="button" class="full">معاينة وفحص الملف</button><div id="csvpreview"></div>${check('importok','راجعت جميع الصفوف، والعميل والموقع والقيمة مؤكدة لكل طلب')}`,'إرسال الدفعة المراجعة',()=>{if(!parsed)throw Error('افحص الملف أولًا.');checked('importok');return{company_id:required('company'),source_ref:required('source'),reviewed:true,rows:parsed}},p=>rpc('admin_engine',{fn:'commit_reviewed_import',payload:p}));$('preview').onclick=async()=>{parsed=null;try{const f=$('csv').files[0];if(!f||f.size>1024*1024)throw Error('اختر ملف CSV حتى 1 ميجابايت.');const all=parseCSV((await f.text()).replace(/^\uFEFF/,''));const h=all.shift()?.map(x=>x.trim());const names=['company_order_ref','customer_name','phone','address','lat','lng','product_egp','delivery_egp','package_count','delivery_on'];if(!h||names.some(n=>!h.includes(n))||new Set(h).size!==h.length)throw Error('أعمدة الملف ناقصة أو مكررة.');if(!all.length||all.length>100)throw Error('الدفعة يجب أن تحتوي 1 إلى 100 طلب.');const seen=new Set();const mapped=all.map((r,i)=>{if(r.length!==h.length)throw Error('عدد الأعمدة خاطئ في السطر '+(i+2));const x=Object.fromEntries(h.map((n,j)=>[n,r[j].trim()]));if(['company_order_ref','customer_name','phone','address','lat','lng','product_egp','delivery_egp','package_count'].some(n=>!x[n]))throw Error('بيانات ناقصة في السطر '+(i+2));if(seen.has(x.company_order_ref))throw Error('رقم طلب مكرر: '+x.company_order_ref);seen.add(x.compan (()=>{
 let pendingPrompt=null,busy=false;
 const button=document.getElementById('installapp'),status=document.getElementById('installstatus');document.getElementById('installmenu').onclick=()=>{document.querySelector('.headmenu').open=false;document.getElementById('installbox').style.display='block';button.click();document.getElementById('installbox').scrollIntoView({behavior:'smooth'});};
 const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 const installed=()=>{pendingPrompt=null;button.hidden=true;status.textContent='Leader مفتوح كتطبيق مستقل.';};
 if(standalone())installed();
 addEventListener('beforeinstallprompt',event=>{event.preventDefault();pendingPrompt=event;button.hidden=false;button.disabled=false;status.textContent='يمكنك تثبيت Leader من الزر.';});
 addEventListener('appinstalled',()=>{pendingPrompt=null;button.disabled=true;button.textContent='تم إرسال طلب التثبيت';status.textContent='وافق كروم على طلب التثبيت. انتظر ظهور الأيقونة واكتمال التثبيت على الجهاز.';});
 button.addEventListener('click',async()=>{
  if(busy)return;
  if(standalone()){installed();return;}
  if(!pendingPrompt){status.textContent='كروم لم يوفّر طلب تثبيت Leader في هذه الصفحة. الزر لا يستطيع تجاوز هذا القيد. يمكنك استخدام «إنشاء اختصار» من قائمة كروم لفتح الصفحة في المتصفح مؤقتًا، بدون حذف تطبيق المندوب أو مسح بيانات الموقع.';return;}
  const prompt=pendingPrompt;pendingPrompt=null;busy=true;button.disabled=true;
  try{await prompt.prompt();const choice=await prompt.userChoice;status.textContent=choice.outcome==='accepted'?'وافق كروم على طلب التثبيت. انتظر اكتماله وظهور أيقونة Leader؛ قبول الطلب وحده لا يؤكد اكتمال التثبيت.':'لم يتم قبول طلب التثبيت. يمكنك إعادة تحميل الصفحة للمحاولة لاحقًا.';}
  catch{status.textContent='تعذر فتح طلب التثبيت في كروم. يمكنك استخدام «إنشاء اختصار» مؤقتًا؛ لا تحذف تطبيق المندوب ولا تمسح بيانات الموقع.';}
  finally{busy=false;button.disabled=false;}
 });
})();
</script></body></html>

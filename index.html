<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f2238"><meta name="togo-build" content="leader-3-install-6"><title>ToGo Leader | الإدارة</title><link rel="icon" href="1-leader-icon-option-01-192.png"><link rel="apple-touch-icon" href="3-leader-icon-option-01-apple.png"><link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ToGo Leader"><link rel="stylesheet" href="style.css"></head><body>
<header><img src="1-logo.png" alt="ToGo"><b>Leader <span class="tiny">الإدارة</span></b><span class="spacer"></span><button id="theme" aria-label="تغيير المظهر">◐</button><button id="logout" aria-label="تسجيل الخروج">خروج</button></header><div id="mode" role="status">جارٍ التحقق من الاتصال</div><div id="notice" role="alert"></div>
<aside id="installbox" style="max-width:1100px;margin:12px auto;padding:0 16px"><button id="installapp" type="button">تثبيت Leader</button><p id="installstatus" role="status" aria-live="polite" class="tiny" style="margin:8px 0;line-height:1.7"></p></aside>
<section id="auth" class="card"><h1>إدارة الشغل، في مكان واحد</h1><p class="mut">سجّل الدخول بحساب الإدارة. حساب المندوب لا يفتح لوحة الإدارة.</p><form id="login"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required dir="ltr"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button class="pri" id="loginbtn">تسجيل الدخول</button></form><p id="authmsg" role="alert"></p></section>
<div class="shell"><nav id="nav" aria-label="أقسام الإدارة"><button data-page="operations">التشغيل</button><button data-page="reports">مراجعة التقارير</button><button data-page="accounts">الحسابات</button></nav><main id="main"></main></div><dialog id="dialog"></dialog>
<script src="config.js"></script><script src="togo-core.js"></script><script type="module" src="app.js"></script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./',updateViaCache:'none'}).catch(()=>{}));</script><script>
(()=>{
 let pendingPrompt=null,busy=false;
 const button=document.getElementById('installapp'),status=document.getElementById('installstatus');
 const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 const installed=()=>{pendingPrompt=null;button.hidden=true;status.textContent='Leader مفتوح كتطبيق مستقل.';};
 if(standalone())installed();
 addEventListener('beforeinstallprompt',event=>{event.preventDefault();pendingPrompt=event;button.hidden=false;button.disabled=false;status.textContent='يمكنك تثبيت Leader من الزر.';});
 addEventListener('appinstalled',()=>{pendingPrompt=null;button.disabled=true;button.textContent='تم إرسال طلب التثبيت';status.textContent='وافق كروم على طلب التثبيت. انتظر ظهور الأيقونة واكتمال التثبيت على الجهاز.';});
 button.addEventListener('click',async()=>{
  if(busy)return;
  if(standalone()){installed();return;}
  if(!pendingPrompt){status.textContent='كروم لم يوفّر طلب تثبيت Leader في هذه الصفحة. الزر لا يستطيع تجاوز هذا القيد. يمكنك استخدام «إنشاء اختصار» من قائمة كروم لفتح الصفحة في المتصفح مؤقتًا، بدون حذف تطبيق المندوب أو مسح بيانات الموقع.';return;}
  const prompt=pendingPrompt;pendingPrompt=null;busy=true;button.disabled=true;
  try{await prompt.prompt();const choice=await prompt.userChoice;status.textContent=choice.outcome==='accepted'?'وافق كروم على طلب التثبيت. انتظر اكتماله وظهور أيقونة Leader؛ قبول الطلب وحده لا يؤكد اكتمال التثبيت.':'لم يتم قبول طلب التثبيت. يمكنك إعادة تحميل الصفحة للمحاولة لاحقًا.';}
  catch{status.textContent='تعذر فتح طلب التثبيت في كروم. يمكنك استخدام «إنشاء اختصار» مؤقتًا؛ لا تحذف تطبيق المندوب ولا تمسح بيانات الموقع.';}
  finally{busy=false;button.disabled=false;}
 });
})();
</script></body></html>
